# Dependabot opens pull requests for outdated or vulnerable dependencies.
# Security updates for known advisories are opened as soon as they appear;
# the schedule below covers regular version updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Fresh releases are the usual vehicle for supply-chain attacks: wait a
    # few days before proposing a new version (matches pnpm's release-age
    # policy).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Node types must match the Node major we run (see .node-version), or
      # APIs missing at runtime would type-check.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # A new Electron major changes the platform the overlay depends on;
      # upgrading is planned work with manual testing, not an automatic bump.
      - dependency-name: electron
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    labels: [dependencies]
    groups:
      # Tooling moves together; one PR per week instead of one per package.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, ci]
