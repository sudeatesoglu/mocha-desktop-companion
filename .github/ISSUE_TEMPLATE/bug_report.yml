name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mocha version
      placeholder: v0.1.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Remove any personal data before pasting.
