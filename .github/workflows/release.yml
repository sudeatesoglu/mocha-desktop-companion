name: Release

# Publishing a GitHub Release builds and attaches the installers. Merging or
# pushing to main never deploys anything by itself.
on:
  release:
    types: [published]
  # Dry run: changes to the packaging setup are built on their pull request,
  # without publishing anything.
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml

# Two runs for the same release must not upload at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  # Runs the build tools (hundreds of third-party packages) with a
  # read-only token, so a compromised dependency cannot publish anything.
  package-macos:
    name: Package macOS DMGs
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to check that the tag is on main
          persist-credentials: false

      # Only commits that went through dev -> main may be released, and the
      # tag must match the version the app reports in its About panel.
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point to a commit on main"
            exit 1
          fi
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the app version $version"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate as CI, on the exact commit being released.
      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:coverage

      - name: Package
        env:
          # electron-builder skips signing on pull request builds to protect
          # signing secrets. The signature here is ad-hoc (no secret), and an
          # unsigned bundle is broken because the fuses modify the binary.
          CSC_FOR_PULL_REQUEST: "true"
        run: pnpm package

      # Fail on a broken bundle instead of shipping it: both apps must carry
      # a complete, valid signature.
      - name: Verify the app bundles
        working-directory: apps/desktop/release
        run: |
          for app in mac-arm64/Mocha.app mac/Mocha.app; do
            codesign --verify --deep --strict "$app"
            echo "$app: signature valid"
          done

      - name: Compute checksums
        working-directory: apps/desktop/release
        run: shasum -a 256 ./*.dmg | sed 's| \./| |' > SHA256SUMS.txt

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmgs
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # Holds the write permissions, and runs no build tools: it only signs and
  # uploads the files the package job produced.
  publish:
    name: Attach installers to the release
    if: github.event_name == 'release'
    needs: package-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach files to the release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmgs
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      # Signed evidence of which workflow, commit and runner produced the DMGs.
      # Verify with: gh attestation verify <file>.dmg --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --clobber dist/*.dmg dist/SHA256SUMS.txt
