<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only our own scripts and styles; no inline code, no remote content. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mocha’s Tower</title>
    <link rel="stylesheet" href="./tower.css" />
  </head>
  <body>
    <main>
      <h1>Mocha’s Tower</h1>
      <!-- The room, Mocha and the actions arrive with the next step (#104). -->
      <dl class="needs">
        <div class="need">
          <dt><label for="mood">Mood</label></dt>
          <dd><meter id="mood" min="0" max="100" low="25" high="75" optimum="100"></meter></dd>
        </div>
        <div class="need">
          <dt><label for="energy">Energy</label></dt>
          <dd><meter id="energy" min="0" max="100" low="25" high="75" optimum="100"></meter></dd>
        </div>
      </dl>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./tower.ts"></script>
  </body>
</html>
