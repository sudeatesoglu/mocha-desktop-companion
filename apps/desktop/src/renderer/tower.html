<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only our own scripts and styles; no inline code, no remote content. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mocha’s Tower</title>
    <link rel="stylesheet" href="./tower.css" />
  </head>
  <body>
    <!-- Drawn at art resolution; CSS scales it up without smoothing. -->
    <canvas id="room" aria-label="Mocha in its room in the Tower"></canvas>
    <main id="main">
      <div class="needs">
        <label for="mood">Mood</label>
        <meter id="mood" min="0" max="100" value="0"></meter>
        <label for="energy">Energy</label>
        <meter id="energy" min="0" max="100" value="0"></meter>
      </div>
      <div class="actions">
        <button type="button" id="pet">Pet</button>
        <button type="button" id="treat">Treat</button>
        <button type="button" id="rest" class="primary">Rest together</button>
      </div>
      <div class="focus">
        <span id="focus-label">Focus with Mocha</span>
        <div class="lengths" id="focus-lengths">
          <button type="button" data-minutes="25">25 min</button>
          <button type="button" data-minutes="40">40 min</button>
          <button type="button" data-minutes="50">50 min</button>
        </div>
        <button type="button" id="focus-end" hidden>End</button>
      </div>
      <!-- Opens the Collection view. -->
      <button type="button" id="finds" class="finds" aria-controls="collection">
        <span>Finds</span>
        <span id="finds-dots" role="img" aria-label="Find meter"></span>
        <span id="finds-text"></span>
        <span aria-hidden="true">›</span>
      </button>
      <!-- Opens the chat (ADR-0013): it says how to turn it on when it is off. -->
      <button type="button" id="talk" class="finds" aria-controls="chat">
        <span>Talk to Mocha</span>
        <span aria-hidden="true">›</span>
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <section id="chat" aria-labelledby="chat-title" hidden>
      <div class="collection-head">
        <button type="button" id="chat-back">‹ Back</button>
        <h2 id="chat-title">Talk</h2>
        <button type="button" id="chat-memories" class="small">What Mocha remembers</button>
      </div>
      <p id="chat-learned" class="learned" hidden></p>
      <ol id="chat-log" class="chat-log"></ol>
      <p id="chat-status" class="note" role="status" aria-live="polite"></p>
      <form id="chat-form" class="chat-form">
        <label class="visually-hidden" for="chat-input">Message to Mocha</label>
        <input id="chat-input" autocomplete="off" maxlength="2000" placeholder="Say something to Mocha…" />
        <button type="submit" class="primary">Send</button>
      </form>
    </section>
    <section id="memories" aria-labelledby="memories-title" hidden>
      <div class="collection-head">
        <button type="button" id="memories-back">‹ Back</button>
        <h2 id="memories-title">What Mocha remembers</h2>
      </div>
      <p class="note">
        Mocha keeps these from your chats. Change or forget any of them; pinned ones always come
        along when you talk.
      </p>
      <ul id="memory-list" class="items memory-list"></ul>
      <p id="memories-empty" class="note" hidden>Nothing yet.</p>
      <p id="memories-status" class="note" role="status" aria-live="polite"></p>
      <button type="button" id="forget-everything" class="danger">Forget everything</button>
    </section>
    <section id="collection" aria-labelledby="collection-title" hidden>
      <div class="collection-head">
        <button type="button" id="collection-back">‹ Back</button>
        <h2 id="collection-title">Collection</h2>
      </div>
      <h3>Wear</h3>
      <ul id="wardrobe" class="items"></ul>
      <p id="wardrobe-note" class="note"></p>
      <h3>Room</h3>
      <ul id="room-items" class="items"></ul>
      <p id="room-note" class="note"></p>
    </section>
    <script type="module" src="./tower.ts"></script>
  </body>
</html>
