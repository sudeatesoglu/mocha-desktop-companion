<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only our own scripts and styles; no inline code, no remote content. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mocha: break ritual</title>
    <link rel="stylesheet" href="./ritual.css" />
  </head>
  <body>
    <!-- Hidden until the main process says where the bubble sits (data-ready). -->
    <section class="bubble" aria-live="polite">
      <div id="choose">
        <p id="message">Break time. Do something small with me?</p>
        <div class="grid" id="rituals">
          <button type="button" id="just-rest">Just rest</button>
        </div>
      </div>
      <div id="guide" hidden>
        <p id="title"></p>
        <p class="step"><span id="step"></span> <span id="seconds"></span></p>
        <div class="row">
          <progress id="progress" max="1" value="0" aria-label="Ritual progress"></progress>
          <button type="button" id="stop">Stop</button>
        </div>
      </div>
      <p id="done" hidden>Nicely done. Enjoy the rest of your break.</p>
    </section>
    <script type="module" src="./ritual.ts"></script>
  </body>
</html>
