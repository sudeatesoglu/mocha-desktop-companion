<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only our own scripts and styles; no inline code, no remote content. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Mocha</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Drawn at sprite resolution; CSS scales it up without smoothing. -->
    <canvas id="mocha" aria-label="Mocha, a pixel-art raven"></canvas>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
