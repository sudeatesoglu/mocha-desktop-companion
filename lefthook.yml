# Git hooks, installed by `pnpm install` (see the `prepare` script).
# Skip in an emergency with `git commit --no-verify`; CI runs the same checks.

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,ts,tsx,json,jsonc,css}'
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
