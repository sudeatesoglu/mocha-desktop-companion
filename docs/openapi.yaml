openapi: 3.1.0
info:
  title: Mocha local API
  version: "1"
  summary: How the paired Mocha browser extension tells Mocha what the user does in the browser.
  description: |
    Mocha's desktop app serves this API to its own browser extension, and to nothing else
    ([ADR-0011](https://github.com/sudeatesoglu/mocha-desktop-companion/blob/main/docs/adr/0011-local-api-for-the-browser-extension.md)).

    - **Off by default.** Nothing listens until the user turns on "Let the Mocha extension
      connect" in Mocha's Settings.
    - **This computer only.** The API listens on `127.0.0.1`, on port 47213 or, if that is
      taken, a free port. The pairing code says which: `<port>-<token>`.
    - **Every request** must carry `Host: 127.0.0.1:<port>`, the extension's own
      `Origin: chrome-extension://bklkopgekhoiendfbkifbpmplojpgipp` and
      `Authorization: Bearer <token>`. Browsers set `Origin` themselves, so web pages cannot
      use this API, and the token keeps out other software on the computer.
    - **Quiet failures.** Refusals have no body. They are checked in this order: Host and
      Origin (403), the rate limit of 120 requests a minute (429), the route (404), the method
      (405), the token (401), then the content (415, 400). Bodies over 4 KB are refused (413).
    - **CORS** answers only the extension's origin, including the preflight (`OPTIONS`) on
      every route.

    Mocha keeps only the latest context, in memory, and never logs it
    ([ADR-0012](https://github.com/sudeatesoglu/mocha-desktop-companion/blob/main/docs/adr/0012-what-mocha-may-know-about-browsing.md)).
  license:
    name: All rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:{port}
    description: Mocha on this computer
    variables:
      port:
        default: "47213"
        description: The port in the pairing code.
security:
  - pairingToken: []
tags:
  - name: Browser extension
    description: Used by the Mocha browser extension.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Browser extension]
      summary: Check that Mocha answers
      description: Answers who is listening, so a client can tell Mocha from another program on the port.
      responses:
        "200":
          description: Mocha answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                app: mocha
                api: 1
        "401":
          $ref: "#/components/responses/WrongToken"
        "403":
          $ref: "#/components/responses/NotTheExtension"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Browser extension]
      summary: Read what the user lets Mocha know and do
      description: |
        Every capability is off until the user turns it on in Mocha's Settings. The extension
        sends only the fields these allow; Mocha drops anything else again.
      responses:
        "200":
          description: The user's choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserCapabilities"
              example:
                kind: true
                site: true
                title: false
                talk: true
                nudge: false
                browserActivity: false
                pageActivity: false
        "401":
          $ref: "#/components/responses/WrongToken"
        "403":
          $ref: "#/components/responses/NotTheExtension"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/context:
    post:
      operationId: reportContext
      tags: [Browser extension]
      summary: Tell Mocha about the tab in front
      description: |
        Sent when the tab in front changes and once a minute. `{}` means there is nothing to
        tell: a page the extension's filter holds back, another app in front, or a pause. Mocha
        then forgets the page before at once. Mocha keeps only the fields the user allows and
        scrubs the title again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowsingContext"
            examples:
              code:
                summary: A code site, with the kind, site and title allowed
                value:
                  kind: code
                  site: github.com
                  title: Pull request 184 · mocha
              activity:
                summary: A video, with browser and page activity allowed
                value:
                  kind: video
                  browser:
                    sound: true
                    tabs: 6
                    switchesPerMinute: 0.4
                    secondsOnPage: 312
                  page:
                    keys: 0
                    scrolls: 2
                    clicks: 1
                    windowSeconds: 30
              nothing:
                summary: Nothing to tell
                value: {}
      responses:
        "204":
          description: Mocha took it in.
        "400":
          description: Not JSON, or not a browsing context.
        "401":
          $ref: "#/components/responses/WrongToken"
        "403":
          $ref: "#/components/responses/NotTheExtension"
        "413":
          description: The body is over 4 KB.
        "415":
          description: The body is not `application/json`.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    pairingToken:
      type: http
      scheme: bearer
      description: The part of the pairing code after the dash, 26 base32 characters. "New code" in Settings replaces it at once.
  responses:
    WrongToken:
      description: No token, or not the current one.
    NotTheExtension:
      description: The `Host` is not `127.0.0.1:<port>`, or the `Origin` is not the extension's.
    TooManyRequests:
      description: Over 120 requests a minute.
  schemas:
    Health:
      type: object
      properties:
        app:
          const: mocha
        api:
          const: 1
          description: The API's major version, as in the paths.
      required: [app, api]
      additionalProperties: false
    BrowserCapabilities:
      type: object
      description: What the user lets Mocha know and do (ADR-0012), each off until turned on.
      properties:
        kind:
          type: boolean
          description: Know what kind of site the user is on.
        site:
          type: boolean
          description: Know the site's name, the registrable domain only.
        title:
          type: boolean
          description: Read page titles, after addresses and numbers are taken out.
        talk:
          type: boolean
          description: Talk about what the user does, in a bubble.
        nudge:
          type: boolean
          description: Nudge the user gently, after a long stretch on social media or late at night.
        browserActivity:
          type: boolean
          description: Notice sound, open tabs, tab switches and time on a page.
        pageActivity:
          type: boolean
          description: Notice typing, scrolling and clicking on a page, as counts.
      required: [kind, site, title, talk, nudge, browserActivity, pageActivity]
      additionalProperties: false
    BrowsingContext:
      type: object
      description: What the extension may tell Mocha about the tab in front. Every part is optional and bounded.
      properties:
        kind:
          type: string
          enum: [code, docs, reading, video, music, social, chat, shopping, other]
          description: The kind of site.
        site:
          type: string
          maxLength: 253
          pattern: ^[a-z0-9-]+(?:\.[a-z0-9-]+)+$
          description: The registrable domain, never a path or a query.
        title:
          type: string
          maxLength: 200
          description: The page title, scrubbed of addresses, emails, numbers and tokens, and shortened.
        browser:
          type: object
          description: What is going on in the browser.
          properties:
            sound:
              type: boolean
              description: Whether a tab plays sound.
            tabs:
              type: integer
              minimum: 0
              maximum: 10000
              description: Open tabs, outside private windows.
            switchesPerMinute:
              type: number
              minimum: 0
              maximum: 1000
              description: Tab switches per minute over the last five minutes.
            secondsOnPage:
              type: integer
              minimum: 0
              maximum: 86400
              description: How long the page in front has been there.
          required: [sound, tabs, switchesPerMinute, secondsOnPage]
          additionalProperties: false
        page:
          type: object
          description: How busy the user is on the page, as counts over a window; never which key, what text or what was clicked.
          properties:
            keys:
              type: integer
              minimum: 0
              maximum: 100000
              description: Key presses, not counting password, one-time code or card fields.
            scrolls:
              type: integer
              minimum: 0
              maximum: 100000
              description: Scroll gestures.
            clicks:
              type: integer
              minimum: 0
              maximum: 100000
            windowSeconds:
              type: integer
              minimum: 1
              maximum: 600
              description: The length of the window the counts cover.
          required: [keys, scrolls, clicks, windowSeconds]
          additionalProperties: false
      additionalProperties: false
